[package]
name = "portal"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# --- Shared (client + server) ---
leptos = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos_meta = { version = "0.8" }
# Pin the proc-macro to the version leptos 0.8.14 declares. Newer macro patches
# (0.8.15+) emit `::leptos::__as_shared_reactive_fn` under cargo-leptos's
# `--cfg erase_components` wasm build, which the 0.8.14 library doesn't export.
leptos_macro = "=0.8.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
http = "1"

# --- Client only (wasm / hydrate) ---
# Pinned to match the wasm-bindgen-cli provided by the flake (must be exact).
wasm-bindgen = { version = "=0.2.121", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlTextAreaElement",
    "CssStyleDeclaration",
    "Storage",
], optional = true }

# --- Server only (ssr) ---
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", features = ["multipart"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["fs", "limit"], optional = true }
tower-sessions = { version = "0.14", optional = true }
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "uuid",
    "chrono",
    "runtime-tokio-rustls",
    "macros",
    "migrate",
], optional = true }
argon2 = { version = "0.5", features = ["std"], optional = true }
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"], optional = true }
ammonia = { version = "4", optional = true }
dotenvy = { version = "0.15", optional = true }

[features]
default = ["ssr"]
hydrate = [
    "leptos/hydrate",
    "dep:wasm-bindgen",
    "dep:console_error_panic_hook",
    "dep:web-sys",
]
ssr = [
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tower-sessions",
    "dep:sqlx",
    "dep:argon2",
    "dep:pulldown-cmark",
    "dep:ammonia",
    "dep:dotenvy",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

# `uuid`'s v4 generation needs a randomness source, and on wasm the `js` feature
# is what supplies one: it binds `crypto.getRandomValues`. The admin screen's
# password generator depends on this — without it there is no CSPRNG in the
# browser build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }

# cargo-leptos configuration
[package.metadata.leptos]
output-name = "portal"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

[[bin]]
name = "portal"
path = "src/main.rs"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
