<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge Base</title>
    <!-- An inline icon: without one the browser asks for /favicon.ico, which
         does not exist, and every session logs a 404 (FEEDBACK-7 §3). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232563eb%27/%3E%3Cpath d=%27M9 9h14v3H9zm0 5.5h14v3H9zM9 20h9v3H9z%27 fill=%27white%27/%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint, from the same key the theme switcher
      // writes. Doing it here rather than in React is what stops the light
      // theme flashing over a dark one while the bundle loads.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          // Kept in step with THEMES in src/components/ThemeSelect.tsx. An
          // unrecognised value falls through to the stylesheet's default
          // rather than being written to the attribute.
          if (["dark", "light", "gruvbox", "gruvbox-light"].indexOf(stored) !== -1) {
            document.documentElement.dataset.theme = stored;
          }
          // Same idea for the language: kept in step with LANGUAGES in
          // src/i18n/index.ts, applied to <html lang> before the bundle runs.
          var lang = localStorage.getItem("lang");
          if (["en", "ru", "uz"].indexOf(lang) !== -1) {
            document.documentElement.lang = lang;
          }
        } catch (e) {
          /* private mode: fall through to the defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
