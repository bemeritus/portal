# Everything a change must pass before merging — the same gates as `just ci`,
# plus a Docker build that proves the production image still assembles.
#
# Three independent jobs so a frontend lint failure doesn't hide a backend
# test failure (and vice versa); the Docker build waits for both, since an
# image of code that fails its own checks is not worth the build minutes.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — fmt, clippy, test, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Only for the migrations step; the unit tests touch no database.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Pinned to the same minor as the Dockerfile's RUST_VERSION, so CI and
      # the image never drift apart — and a new stable's new clippy lints
      # can't start failing PRs until the pin is bumped deliberately.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy (warnings denied)
        run: cargo clippy --all-targets -- -D warnings

      # Unit tests only — sqlx queries are runtime-checked and the tests touch
      # no database. One of them fails on two migrations with one version.
      - name: tests
        run: cargo test

      # The whole set on a fresh database through the API's own migrator, as
      # a start would. The `database` job's psql loop cannot catch this: it
      # never looks at version numbers.
      - name: migrations (fresh database, sqlx)
        run: cargo run -q -- migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/portal

  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Matches the Dockerfile's NODE_VERSION.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      # Unit tests, including the check that every locale has every key.
      - name: tests
        run: npm test

      # `tsc -b && vite build` — catches anything typecheck's project
      # references miss and proves the bundle actually assembles.
      - name: build
        run: npm run build

  # Rules the database enforces by itself (DC devices never share a unit on
  # one face, a device fits its rack, …), with every API check bypassed. The
  # migrations are applied in order with psql — the same files sqlx embeds.
  database:
    name: Database — DC constraints
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: portal
    steps:
      - uses: actions/checkout@v4

      - name: migrations
        run: for f in backend/migrations/*.sql; do psql -q -v ON_ERROR_STOP=1 -f "$f"; done

      - name: constraints
        run: psql -q -v ON_ERROR_STOP=1 -f backend/tests/dc_constraints.sql

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — nothing is pushed. The GHA backend caches image *layers*
      # between runs; the Dockerfile's RUN cache mounts are ephemeral on hosted
      # runners, so the release compile reruns when backend sources change —
      # acceptable for a merge gate, and it needs no registry or secrets.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
