[package]
name = "portal-cfd-worker"
version = "0.1.0"
edition = "2024"
description = "Runs the airflow model's OpenFOAM jobs queued in Postgres"

[[bin]]
name = "portal-cfd-worker"
path = "src/main.rs"

[dependencies]
portal-cfd = { path = "../cfd" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "signal", "fs"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "json", "chrono", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
